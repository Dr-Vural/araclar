<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<div class="tk-cols">
<div>
  <div class="tk-drop" id="pw-drop" tabindex="0" role="button">
    <svg viewBox="0 0 24 24"><path d="M14 2H6v20h12V8z M14 2v6h4"/><path d="M8 16l8-6"/></svg>
    <strong>PDF bırakın</strong><span>Filigran bütün sayfalara uygulanır</span>
  </div>
  <input type="file" id="pw-file" class="tk-hidden" accept="application/pdf,.pdf">
  <div class="tk-panel">
    <p class="tk-h">Filigran</p>
    <div class="tk-field"><label for="pw-text">Metin</label>
      <input type="text" id="pw-text" class="tk-in" value="TASLAK — ÇOĞALTILAMAZ"></div>
    <div class="tk-two">
      <div class="tk-field"><label for="pw-size">Yazı boyutu — <span class="tk-val" id="pw-sv">48</span></label>
        <input type="range" id="pw-size" class="tk-range" min="12" max="140" value="48"></div>
      <div class="tk-field"><label for="pw-op">Saydamlık — <span class="tk-val" id="pw-ov">18</span>%</label>
        <input type="range" id="pw-op" class="tk-range" min="3" max="80" value="18"></div>
    </div>
    <div class="tk-two">
      <div class="tk-field"><label for="pw-ang">Açı — <span class="tk-val" id="pw-av">45</span>°</label>
        <input type="range" id="pw-ang" class="tk-range" min="-90" max="90" value="45"></div>
      <div class="tk-field"><label for="pw-col">Renk</label>
        <input type="color" id="pw-col" class="tk-in" value="#9b2c2c" style="height:44px;padding:4px"></div>
    </div>
    <div class="tk-field"><label for="pw-mode">Yerleşim</label>
      <select id="pw-mode" class="tk-sel">
        <option value="center">Ortada tek</option>
        <option value="tile">Döşeli — sayfayı kaplar</option>
        <option value="bottom">Alt kenarda</option>
      </select></div>
    <div class="tk-acts">
      <button class="tk-btn" id="pw-go" disabled>Filigran ekle</button>
      <span class="tk-msg" id="pw-msg">dosya bekleniyor</span>
    </div>
  </div>
</div>
<div class="tk-panel">
  <p class="tk-h">Önizleme</p>
  <div class="tk-prev" id="pw-prev" style="background:#fff"></div>
  <div id="pw-res"></div>
  <p class="tk-note">Türkçe karakterler PDF'in gömülü yazı tiplerinde çoğu zaman
     bulunmaz. Bu yüzden filigran metin olarak değil, tarayıcıda çizilip görsel
     olarak damgalanır — ç, ğ, ı, İ, ş, ü sorunsuz görünür.</p>
</div>
</div>
<script>//<![CDATA[
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var drop=$("pw-drop"),inp=$("pw-file"),msg=$("pw-msg"),go=$("pw-go"),prev=$("pw-prev");
var buf=null,name="belge";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
drop.addEventListener("click",function(){inp.click()});
drop.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();inp.click()}});
["dragenter","dragover"].forEach(function(v){drop.addEventListener(v,function(e){e.preventDefault();drop.classList.add("hot")})});
["dragleave","drop"].forEach(function(v){drop.addEventListener(v,function(e){e.preventDefault();drop.classList.remove("hot")})});
drop.addEventListener("drop",function(e){take(e.dataTransfer.files[0])});
inp.addEventListener("change",function(e){take(e.target.files[0])});
["pw-text","pw-size","pw-op","pw-ang","pw-col","pw-mode"].forEach(function(id){
  $(id).addEventListener("input",function(){
    if(id==="pw-size")$("pw-sv").textContent=this.value;
    if(id==="pw-op")$("pw-ov").textContent=this.value;
    if(id==="pw-ang")$("pw-av").textContent=this.value;
    draw();
  });
  $(id).addEventListener("change",draw);
});
function take(f){
  if(!f)return;name=f.name.replace(/\.pdf$/i,"");
  f.arrayBuffer().then(function(b){
    buf=b;return PDFLib.PDFDocument.load(b,{ignoreEncryption:true});
  }).then(function(d){
    go.disabled=false;msg.className="tk-msg";
    msg.textContent=d.getPageCount()+" sayfa y\u00fcklendi";
  }).catch(function(e){
    msg.className="tk-msg err";
    msg.textContent=/encrypt|password/i.test(e.message)?"parola korumal\u0131 dosya":"okunamad\u0131";
  });
}
/* Filigran\u0131 canvas'ta \u00e7izip \u015feffaf PNG olarak \u00fcretir. */
function stamp(w,h){
  var txt=$("pw-text").value||" ",size=+$("pw-size").value,ang=+$("pw-ang").value*Math.PI/180;
  var col=$("pw-col").value,mode=$("pw-mode").value;
  var c=document.createElement("canvas");c.width=Math.round(w);c.height=Math.round(h);
  var x=c.getContext("2d");
  x.font="600 "+size+'px "IBM Plex Sans", system-ui, sans-serif';
  x.fillStyle=col;x.textAlign="center";x.textBaseline="middle";
  var tw=x.measureText(txt).width;
  if(mode==="tile"){
    var stepX=tw+size*2.2, stepY=size*3.2;
    x.save();x.translate(w/2,h/2);x.rotate(ang);
    var R=Math.sqrt(w*w+h*h)/2;
    for(var py=-R;py<R;py+=stepY)for(var px=-R;px<R;px+=stepX)x.fillText(txt,px,py);
    x.restore();
  }else if(mode==="bottom"){
    x.save();x.translate(w/2,h-size*1.3);x.fillText(txt,0,0);x.restore();
  }else{
    x.save();x.translate(w/2,h/2);x.rotate(ang);x.fillText(txt,0,0);x.restore();
  }
  return c;
}
function draw(){
  var c=stamp(420,594);
  c.style.opacity=(+$("pw-op").value/100);
  prev.innerHTML="";prev.appendChild(c);
}
go.addEventListener("click",function(){
  if(!buf)return;
  msg.className="tk-msg";msg.textContent="uygulan\u0131yor\u2026";go.disabled=true;
  var op=+$("pw-op").value/100;
  PDFLib.PDFDocument.load(buf,{ignoreEncryption:true}).then(function(doc){
    var pgs=doc.getPages(),cache={};
    var chain=Promise.resolve();
    pgs.forEach(function(p){
      chain=chain.then(function(){
        var s=p.getSize(),k=Math.round(s.width)+"x"+Math.round(s.height);
        var png=cache[k]||(cache[k]=stamp(s.width*2,s.height*2).toDataURL("image/png"));
        return doc.embedPng(png).then(function(im){
          p.drawImage(im,{x:0,y:0,width:s.width,height:s.height,opacity:op});
        });
      });
    });
    return chain.then(function(){return doc.save()});
  }).then(function(b){
    var blob=new Blob([b],{type:"application/pdf"});
    $("pw-res").innerHTML='<div class="tk-acts"><a class="tk-btn" style="text-decoration:none" href="'
      +URL.createObjectURL(blob)+'" download="'+esc(name)+'-filigranli.pdf">indir</a></div>';
    msg.textContent="filigran eklendi";go.disabled=false;
  }).catch(function(e){msg.className="tk-msg err";msg.textContent=e.message;go.disabled=false});
});
draw();
})();
//]]></script>

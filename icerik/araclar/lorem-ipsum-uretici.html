<div class="tk-cols rev">
<div class="tk-panel">
  <p class="tk-h">Metin</p>
  <div class="tk-out" id="li-out" style="max-height:520px;font-family:var(--sans);font-size:15px"><span class="tk-blank">Ayarları seçip “Üret”e basın.</span></div>
  <div class="tk-acts">
    <button class="tk-btn" id="li-go">Üret</button>
    <button class="tk-btn ghost" id="li-copy">Kopyala</button>

  </div>
</div>
<div class="tk-panel">
  <p class="tk-h">Ayar</p>
  <div class="tk-field"><label for="li-lang">Dil</label>
    <select id="li-lang" class="tk-sel">
      <option value="tr">Türkçe — gerçek harf dağılımı</option>
      <option value="la">Latince — klasik lorem ipsum</option>
      <option value="ru">Rusça</option>
    </select></div>
  <div class="tk-field"><label for="li-unit">Birim</label>
    <select id="li-unit" class="tk-sel"><option value="p">paragraf</option>
    <option value="s">cümle</option><option value="w">kelime</option></select></div>

    <input type="number" id="li-n" class="tk-in" value="4" min="1" max="200"></div>
  <div class="tk-field"><label for="li-fmt">Çıktı</label>
    <select id="li-fmt" class="tk-sel"><option value="txt">Düz metin</option>
    <option value="html">HTML — &lt;p&gt; etiketli</option></select></div>
  <div class="tk-checks">
    <label><input type="checkbox" id="li-start"><span>Klasik açılışla başla<em>"Lorem ipsum dolor sit amet…"</em></span></label>
  </div>
  <p class="tk-note">Türkçe seçeneği, Türkçenin gerçek harf ve hece dağılımını
     taklit eden kelimelerden kurulur. Latince lorem ipsum, Türkçe bir tasarımda
     satır uzunluğunu ve gri tonunu yanıltır; Türkçe metin gerçek görünümü verir.</p>
</div>
</div>
<script>//<![CDATA[

"use strict";

var W={

tr:("bir y\u0131l sonra kentin g\u00fcney yakas\u0131nda k\u00fc\u00e7\u00fck bir at\u00f6lye a\u00e7\u0131ld\u0131 orada \u00e7al\u0131\u015fanlar "
 +"sabah\u0131n erken saatlerinde gelir ak\u015fam ge\u00e7 vakit da\u011f\u0131l\u0131rd\u0131 duvarlardaki \u00e7izimler "
 +"y\u0131llar i\u00e7inde birikmi\u015f say\u0131s\u0131z denemenin izini ta\u015f\u0131yordu kimse tam olarak ne "
 +"zaman ba\u015flad\u0131\u011f\u0131n\u0131 hat\u0131rlam\u0131yordu ama herkes ayn\u0131 \u015feyi s\u00f6yl\u00fcyordu buran\u0131n kendine "
 +"\u00f6zg\u00fc bir d\u00fczeni var ya\u011fmurlu g\u00fcnlerde pencereden i\u00e7eri s\u0131zan \u0131\u015f\u0131k masalar\u0131n "
 +"\u00fczerine d\u00fc\u015fer k\u00e2\u011f\u0131tlar hafif\u00e7e k\u0131vr\u0131l\u0131rd\u0131 ustalar gen\u00e7 olanlara \u00f6nce beklemeyi "
 +"\u00f6\u011fretirdi \u00e7\u00fcnk\u00fc acele eden el do\u011fru \u00f6l\u00e7\u00fcy\u00fc tutturamazd\u0131 ak\u015fam\u00fcst\u00fc \u00e7ay demlenir "
 +"konu\u015fmalar uzard\u0131 sonra herkes kendi k\u00f6\u015fesine \u00e7ekilir ertesi g\u00fcne haz\u0131rlan\u0131rd\u0131 "
 +"b\u00f6ylece mevsimler ge\u00e7ti ve at\u00f6lye h\u00e2l\u00e2 ayn\u0131 yerde duruyor").split(" "),
ru:("\u043e\u0434\u043d\u0430\u0436\u0434\u044b \u0432 \u043d\u0435\u0431\u043e\u043b\u044c\u0448\u043e\u043c \u0433\u043e\u0440\u043e\u0434\u0435 \u043d\u0430 \u0431\u0435\u0440\u0435\u0433\u0443 \u0440\u0435\u043a\u0438 \u043e\u0442\u043a\u0440\u044b\u043b\u0430\u0441\u044c \u043c\u0430\u0441\u0442\u0435\u0440\u0441\u043a\u0430\u044f \u0433\u0434\u0435 \u0440\u0430\u0431\u043e\u0442\u0430\u043b\u0438 "
 +"\u043c\u0430\u0441\u0442\u0435\u0440\u0430 \u0440\u0430\u0437\u043d\u044b\u0445 \u043f\u043e\u043a\u043e\u043b\u0435\u043d\u0438\u0439 \u0443\u0442\u0440\u043e\u043c \u043e\u043d\u0438 \u043f\u0440\u0438\u0445\u043e\u0434\u0438\u043b\u0438 \u0440\u0430\u043d\u043e \u0430 \u0440\u0430\u0441\u0445\u043e\u0434\u0438\u043b\u0438\u0441\u044c \u043f\u043e\u0437\u0434\u043d\u043e \u0432\u0435\u0447\u0435\u0440\u043e\u043c "
 +"\u043d\u0430 \u0441\u0442\u0435\u043d\u0430\u0445 \u0432\u0438\u0441\u0435\u043b\u0438 \u0447\u0435\u0440\u0442\u0435\u0436\u0438 \u043d\u0430\u043a\u043e\u043f\u043b\u0435\u043d\u043d\u044b\u0435 \u0437\u0430 \u0434\u043e\u043b\u0433\u0438\u0435 \u0433\u043e\u0434\u044b \u043d\u0438\u043a\u0442\u043e \u0443\u0436\u0435 \u043d\u0435 \u043f\u043e\u043c\u043d\u0438\u043b \u043a\u043e\u0433\u0434\u0430 "
 +"\u0438\u043c\u0435\u043d\u043d\u043e \u0432\u0441\u0451 \u043d\u0430\u0447\u0430\u043b\u043e\u0441\u044c \u043d\u043e \u043a\u0430\u0436\u0434\u044b\u0439 \u043f\u043e\u0432\u0442\u043e\u0440\u044f\u043b \u043e\u0434\u043d\u043e \u0438 \u0442\u043e \u0436\u0435 \u0437\u0434\u0435\u0441\u044c \u0441\u0432\u043e\u0439 \u043e\u0441\u043e\u0431\u044b\u0439 \u043f\u043e\u0440\u044f\u0434\u043e\u043a "
 +"\u0432 \u0434\u043e\u0436\u0434\u043b\u0438\u0432\u044b\u0435 \u0434\u043d\u0438 \u0441\u0432\u0435\u0442 \u043f\u0440\u043e\u043d\u0438\u043a\u0430\u043b \u0447\u0435\u0440\u0435\u0437 \u043e\u043a\u043d\u043e \u0438 \u043f\u0430\u0434\u0430\u043b \u043d\u0430 \u0441\u0442\u043e\u043b\u044b \u0431\u0443\u043c\u0430\u0433\u0430 \u0441\u043b\u0435\u0433\u043a\u0430 "
 +"\u0438\u0437\u0433\u0438\u0431\u0430\u043b\u0430\u0441\u044c \u0441\u0442\u0430\u0440\u0448\u0438\u0435 \u0443\u0447\u0438\u043b\u0438 \u043c\u043e\u043b\u043e\u0434\u044b\u0445 \u043f\u0440\u0435\u0436\u0434\u0435 \u0432\u0441\u0435\u0433\u043e \u0442\u0435\u0440\u043f\u0435\u043d\u0438\u044e \u043f\u043e\u0442\u043e\u043c\u0443 \u0447\u0442\u043e \u0442\u043e\u0440\u043e\u043f\u043b\u0438\u0432\u0430\u044f "
 +"\u0440\u0443\u043a\u0430 \u043d\u0435 \u043d\u0430\u0445\u043e\u0434\u0438\u0442 \u0432\u0435\u0440\u043d\u043e\u0439 \u043c\u0435\u0440\u044b \u0432\u0435\u0447\u0435\u0440\u043e\u043c \u0437\u0430\u0432\u0430\u0440\u0438\u0432\u0430\u043b\u0438 \u0447\u0430\u0439 \u0431\u0435\u0441\u0435\u0434\u044b \u0437\u0430\u0442\u044f\u0433\u0438\u0432\u0430\u043b\u0438\u0441\u044c "
 +"\u0437\u0430\u0442\u0435\u043c \u043a\u0430\u0436\u0434\u044b\u0439 \u0432\u043e\u0437\u0432\u0440\u0430\u0449\u0430\u043b\u0441\u044f \u0432 \u0441\u0432\u043e\u0439 \u0443\u0433\u043e\u043b \u0438 \u0433\u043e\u0442\u043e\u0432\u0438\u043b\u0441\u044f \u043a \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0435\u043c\u0443 \u0434\u043d\u044e").split(" ")
};
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function sentence(w,first){
  var n=6+Math.floor(Math.random()*12),parts=[];
  for(var i=0;i<n;i++)parts.push(rnd(w));
  var s=parts.join(" ");
  if(Math.random()<0.3){
    var k=3+Math.floor(Math.random()*(n-4));
    s=parts.slice(0,k).join(" ")+", "+parts.slice(k).join(" ");
  }
  return s[0].toLocaleUpperCase("tr")+s.slice(1)+".";
}
function run(){
  var w=W[$("li-lang").value],unit=$("li-unit").value,n=Math.min(200,+$("li-n").value||1);
  var blocks=[];
  if(unit==="w"){
    var a=[];for(var i=0;i<n;i++)a.push(rnd(w));
    var t=a.join(" ");blocks=[t[0].toLocaleUpperCase("tr")+t.slice(1)+"."];
  }else if(unit==="s"){
    var s=[];for(var j=0;j<n;j++)s.push(sentence(w));
    blocks=[s.join(" ")];
  }else{
    for(var p=0;p<n;p++){
      var q=[],m=3+Math.floor(Math.random()*4);
      for(var k=0;k<m;k++)q.push(sentence(w));
      blocks.push(q.join(" "));
    }
  }
  if($("li-start").checked&&blocks.length)
    blocks[0]="Lorem ipsum dolor sit amet, consectetur adipiscing elit. "+blocks[0];
  var fmt=$("li-fmt").value;
  var txt=fmt==="html"?blocks.map(function(b){return "<p>"+b+"</p>"}).join("\n")
                      :blocks.join("\n\n");
  $("li-out").textContent=txt;
  $("li-msg").textContent=txt.split(/\s+/).length+" kelime \u00b7 "+txt.length+" karakter";
}
$("li-go").addEventListener("click",run);
["li-lang","li-unit","li-n","li-fmt","li-start"].forEach(function(id){
  $(id).addEventListener("change",run)});
$("li-copy").addEventListener("click",function(){
  navigator.clipboard.writeText($("li-out").textContent).then(function(){$("li-msg").textContent="kopyaland\u0131"})});
run();
})();
//]]></script>

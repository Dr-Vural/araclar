<div class="tk-cols rev">
<div class="tk-panel">
  <p class="tk-h">Metin</p>
  <div class="tk-field"><label for="mt-in">Girdi</label>
    <textarea id="mt-in" class="tk-area" placeholder="PDF'ten veya web sayfasından kopyaladığınız metni yapıştırın…"></textarea></div>
  <div class="tk-field"><label for="mt-out">Temizlenmiş</label>
    <textarea id="mt-out" class="tk-area" readonly></textarea></div>
  <div class="tk-acts">
    <button class="tk-btn ghost" id="mt-copy">Kopyala</button>
    <button class="tk-btn ghost" id="mt-swap">Sonucu girdiye al</button>
    <span class="tk-msg" id="mt-msg"></span>
  </div>
</div>
<div class="tk-panel">
  <p class="tk-h">Temizlik</p>
  <div class="tk-checks">
    <label><input type="checkbox" id="mt-ws" checked><span>Art arda boşlukları teke indir</span></label>
    <label><input type="checkbox" id="mt-trim" checked><span>Satır başı ve sonundaki boşlukları kırp</span></label>
    <label><input type="checkbox" id="mt-blank" checked><span>Üst üste boş satırları teke indir</span></label>
    <label><input type="checkbox" id="mt-hyph" checked><span>Satır sonu tirelerini birleştir<em>PDF'ten kopyalanan metinde "kelime-" + satır sonu</em></span></label>
    <label><input type="checkbox" id="mt-wrap"><span>Satır kırılmalarını kaldır<em>Paragrafı tek satır yapar — PDF ve e-posta metinleri için</em></span></label>
    <label><input type="checkbox" id="mt-inv" checked><span>Görünmez karakterleri sök</span></label>
    <label><input type="checkbox" id="mt-quote"><span>Akıllı tırnakları düz tırnağa çevir<em>“ ” ‘ ’ → " '</em></span></label>
    <label><input type="checkbox" id="mt-dash"><span>Uzun tireleri normal tireye çevir</span></label>
    <label><input type="checkbox" id="mt-url"><span>Bağlantıları sil</span></label>
    <label><input type="checkbox" id="mt-num"><span>Satır başındaki numaraları sil<em>1. · 1) · (1) · - · •</em></span></label>
  </div>
  <div class="tk-stats" style="margin-top:18px">
    <div class="tk-stat"><b id="mt-a">0</b><span>girdi</span></div>
    <div class="tk-stat ok"><b id="mt-b">0</b><span>çıktı</span></div>
    <div class="tk-stat"><b id="mt-d">0</b><span>silinen</span></div>
  </div>
</div>
</div>
<script>//<![CDATA[
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var INV=/[\u200b\u200c\u200d\u2060\ufeff\u180e\u061c\u200e\u200f\u202a-\u202e\u2066-\u2069\u00ad]/g;
var SP=/[\u00a0\u2002\u2003\u2007\u2009\u200a\u202f\u205f\u3000]/g;
function run(){
  var s=$("mt-in").value,n0=s.length;
  if($("mt-inv").checked)s=s.replace(INV,"").replace(SP," ");
  if($("mt-hyph").checked)s=s.replace(/(\p{L})[-\u2010\u2011]\s*\n\s*(\p{L})/gu,"$1$2");
  if($("mt-url").checked)s=s.replace(/https?:\/\/\S+/g,"").replace(/www\.\S+/g,"");
  if($("mt-quote").checked)s=s.replace(/[\u201c\u201d\u201e\u00ab\u00bb]/g,'"').replace(/[\u2018\u2019\u201a]/g,"'");
  if($("mt-dash").checked)s=s.replace(/[\u2012\u2013\u2014\u2015]/g,"-");
  if($("mt-num").checked)s=s.split("\n").map(function(l){
    return l.replace(/^\s*(?:\(?\d{1,3}[.)]|[-\u2013\u2014*\u2022\u00b7])\s+/,"")}).join("\n");
  if($("mt-wrap").checked)s=s.replace(/([^\n])\n(?!\n)([^\n])/g,"$1 $2");
  if($("mt-ws").checked)s=s.replace(/[ \t]{2,}/g," ");
  if($("mt-trim").checked)s=s.split("\n").map(function(l){return l.replace(/^[ \t]+|[ \t]+$/g,"")}).join("\n");
  if($("mt-blank").checked)s=s.replace(/\n{3,}/g,"\n\n");
  s=s.replace(/^\n+|\n+$/g,"");
  $("mt-out").value=s;
  $("mt-a").textContent=n0.toLocaleString("tr-TR");
  $("mt-b").textContent=s.length.toLocaleString("tr-TR");
  $("mt-d").textContent=Math.max(0,n0-s.length).toLocaleString("tr-TR");
}
$("mt-in").addEventListener("input",run);
Array.prototype.forEach.call(document.querySelectorAll('[id^="mt-"]'),function(n){
  if(n.type==="checkbox")n.addEventListener("change",run)});
$("mt-copy").addEventListener("click",function(){
  navigator.clipboard.writeText($("mt-out").value).then(function(){$("mt-msg").textContent="kopyaland\u0131"})});
$("mt-swap").addEventListener("click",function(){$("mt-in").value=$("mt-out").value;run()});
})();
//]]></script>

<div class="tk-cols rev">
<div class="tk-panel">
  <p class="tk-h">Önizleme</p>
  <div class="tk-prev" id="cg-prev" style="min-height:280px;background:#fff">
    <div id="cg-box" style="width:220px;height:150px;border-radius:12px;background:#0d6357"></div>
  </div>
  <p class="tk-h2">CSS</p>
  <div class="tk-out" id="cg-code">—</div>
  <div class="tk-acts"><button class="tk-btn ghost" id="cg-copy">Kopyala</button>
    <span class="tk-msg" id="cg-msg"></span></div>
</div>
<div class="tk-panel">
  <p class="tk-h">Tür</p>
  <div class="tk-field"><label for="cg-kind">Ne üretilsin</label>
    <select id="cg-kind" class="tk-sel">
      <option value="shadow">Kutu gölgesi</option>
      <option value="grad">Gradyan</option>
      <option value="radius">Köşe yuvarlaklığı</option>
      <option value="glass">Buzlu cam</option>
    </select></div>
  <div id="cg-shadow">
    <div class="tk-two">
      <div class="tk-field"><label>Yatay — <span class="tk-val" id="cg-xv">0</span>px</label>
        <input type="range" id="cg-x" class="tk-range" min="-40" max="40" value="0"></div>
      <div class="tk-field"><label>Dikey — <span class="tk-val" id="cg-yv">12</span>px</label>
        <input type="range" id="cg-y" class="tk-range" min="-40" max="60" value="12"></div>
    </div>
    <div class="tk-two">
      <div class="tk-field"><label>Bulanıklık — <span class="tk-val" id="cg-bv">28</span>px</label>
        <input type="range" id="cg-b" class="tk-range" min="0" max="100" value="28"></div>
      <div class="tk-field"><label>Yayılma — <span class="tk-val" id="cg-sv">-4</span>px</label>
        <input type="range" id="cg-s" class="tk-range" min="-30" max="40" value="-4"></div>
    </div>
    <div class="tk-two">
      <div class="tk-field"><label for="cg-sc">Renk</label>
        <input type="color" id="cg-sc" class="tk-in" value="#15171a" style="height:44px;padding:4px"></div>
      <div class="tk-field"><label>Saydamlık — <span class="tk-val" id="cg-ov">18</span>%</label>
        <input type="range" id="cg-o" class="tk-range" min="1" max="100" value="18"></div>
    </div>
    <div class="tk-checks"><label><input type="checkbox" id="cg-in"><span>İç gölge (inset)</span></label></div>
  </div>
  <div id="cg-grad" style="display:none">
    <div class="tk-field"><label for="cg-gt">Biçim</label>
      <select id="cg-gt" class="tk-sel"><option value="linear">Doğrusal</option>
      <option value="radial">Dairesel</option><option value="conic">Konik</option></select></div>
    <div class="tk-field"><label>Açı — <span class="tk-val" id="cg-av">135</span>°</label>
      <input type="range" id="cg-a" class="tk-range" min="0" max="360" value="135"></div>
    <div class="tk-two">
      <div class="tk-field"><label for="cg-c1">Renk 1</label>
        <input type="color" id="cg-c1" class="tk-in" value="#0d6357" style="height:44px;padding:4px"></div>
      <div class="tk-field"><label for="cg-c2">Renk 2</label>
        <input type="color" id="cg-c2" class="tk-in" value="#8a5c00" style="height:44px;padding:4px"></div>
    </div>
    <div class="tk-checks"><label><input type="checkbox" id="cg-c3on"><span>Üçüncü renk ekle</span></label></div>
    <div class="tk-field"><input type="color" id="cg-c3" class="tk-in" value="#9b2c2c" style="height:44px;padding:4px"></div>
  </div>
  <div id="cg-radius" style="display:none">
    <div class="tk-two">
      <div class="tk-field"><label>Sol üst — <span class="tk-val" id="cg-r1v">12</span></label>
        <input type="range" id="cg-r1" class="tk-range" min="0" max="100" value="12"></div>
      <div class="tk-field"><label>Sağ üst — <span class="tk-val" id="cg-r2v">12</span></label>
        <input type="range" id="cg-r2" class="tk-range" min="0" max="100" value="12"></div>
    </div>
    <div class="tk-two">
      <div class="tk-field"><label>Sağ alt — <span class="tk-val" id="cg-r3v">12</span></label>
        <input type="range" id="cg-r3" class="tk-range" min="0" max="100" value="12"></div>
      <div class="tk-field"><label>Sol alt — <span class="tk-val" id="cg-r4v">12</span></label>
        <input type="range" id="cg-r4" class="tk-range" min="0" max="100" value="12"></div>
    </div>
  </div>
  <div id="cg-glass" style="display:none">
    <div class="tk-field"><label>Bulanıklık — <span class="tk-val" id="cg-glv">10</span>px</label>
      <input type="range" id="cg-gl" class="tk-range" min="0" max="30" value="10"></div>
    <div class="tk-field"><label>Zemin saydamlığı — <span class="tk-val" id="cg-gav">25</span>%</label>
      <input type="range" id="cg-ga" class="tk-range" min="0" max="90" value="25"></div>
  </div>
</div>
</div>
<script>//<![CDATA[
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var box=$("cg-box"),prev=$("cg-prev");
function hexa(h,a){
  var r=parseInt(h.substr(1,2),16),g=parseInt(h.substr(3,2),16),b=parseInt(h.substr(5,2),16);
  return "rgba("+r+", "+g+", "+b+", "+(a/100).toFixed(2)+")";
}
function show(){
  var k=$("cg-kind").value;
  ["shadow","grad","radius","glass"].forEach(function(n){
    $("cg-"+n).style.display=(k===n)?"":"none"});
  run();
}
function run(){
  var k=$("cg-kind").value,css="";
  box.style.cssText="width:220px;height:150px;border-radius:12px;background:#0d6357";
  prev.style.background="#fff";
  if(k==="shadow"){
    ["x","y","b","s","o"].forEach(function(n){$("cg-"+n+"v").textContent=$("cg-"+n).value});
    var v=($("cg-in").checked?"inset ":"")+$("cg-x").value+"px "+$("cg-y").value+"px "
      +$("cg-b").value+"px "+$("cg-s").value+"px "+hexa($("cg-sc").value,+$("cg-o").value);
    box.style.boxShadow=v;css="box-shadow: "+v+";";
  }else if(k==="grad"){
    $("cg-av").textContent=$("cg-a").value;
    var cols=[$("cg-c1").value,$("cg-c2").value];
    if($("cg-c3on").checked)cols.push($("cg-c3").value);
    var t=$("cg-gt").value,a=$("cg-a").value,v2;
    if(t==="linear")v2="linear-gradient("+a+"deg, "+cols.join(", ")+")";
    else if(t==="radial")v2="radial-gradient(circle at 50% 50%, "+cols.join(", ")+")";
    else v2="conic-gradient(from "+a+"deg at 50% 50%, "+cols.join(", ")+")";
    box.style.background=v2;box.style.width="260px";box.style.height="180px";
    css="background: "+v2+";";
  }else if(k==="radius"){
    var r=[1,2,3,4].map(function(i){$("cg-r"+i+"v").textContent=$("cg-r"+i).value;
      return $("cg-r"+i).value+"px"});
    box.style.borderRadius=r.join(" ");
    css="border-radius: "+r.join(" ")+";";
  }else{
    $("cg-glv").textContent=$("cg-gl").value;$("cg-gav").textContent=$("cg-ga").value;
    prev.style.background="linear-gradient(135deg,#0d6357,#8a5c00)";
    var bl=$("cg-gl").value,al=$("cg-ga").value;
    box.style.background="rgba(255,255,255,"+(al/100).toFixed(2)+")";
    box.style.backdropFilter="blur("+bl+"px)";
    box.style.webkitBackdropFilter="blur("+bl+"px)";
    box.style.border="1px solid rgba(255,255,255,.35)";
    css="background: rgba(255, 255, 255, "+(al/100).toFixed(2)+");\n"
      +"backdrop-filter: blur("+bl+"px);\n"
      +"-webkit-backdrop-filter: blur("+bl+"px);\n"
      +"border: 1px solid rgba(255, 255, 255, 0.35);";
  }
  $("cg-code").textContent=css;
}
$("cg-kind").addEventListener("change",show);
Array.prototype.forEach.call(document.querySelectorAll('[id^="cg-"]'),function(n){
  if(n.tagName==="INPUT"||n.tagName==="SELECT"){
    n.addEventListener("input",run);n.addEventListener("change",run)}});
$("cg-copy").addEventListener("click",function(){
  navigator.clipboard.writeText($("cg-code").textContent).then(function(){
    $("cg-msg").textContent="kopyaland\u0131"})});
show();
})();
//]]></script>

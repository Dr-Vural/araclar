<div class="tk-cols">
<div>
  <div class="tk-drop" id="fv-drop" tabindex="0" role="button">
    <svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.8.8-5 4.7 1.3 6.8L12 17.3 6 20.6l1.3-6.8-5-4.7 6.8-.8z"/></svg>
    <strong>Logo bırakın</strong>
    <span>Kare ve en az 512×512 olması en iyi sonucu verir</span>
  </div>
  <input type="file" id="fv-file" class="tk-hidden" accept="image/*">
  <div class="tk-panel">
    <p class="tk-h">Ayarlar</p>
    <div class="tk-field"><label for="fv-bg">Zemin rengi (şeffaflığı korumak için boş bırakın)</label>
      <input type="color" id="fv-bg" class="tk-in" value="#ffffff" style="height:44px;padding:4px"></div>
    <div class="tk-checks">
      <label><input type="checkbox" id="fv-keep" checked>
        <span>Şeffaflığı koru<em>Kapalıysa yukarıdaki zemin rengi uygulanır</em></span></label>
      <label><input type="checkbox" id="fv-pad">
        <span>Kenar boşluğu bırak (%10)<em>Kare olmayan logolar için</em></span></label>
    </div>
    <div class="tk-acts"><button class="tk-btn" id="fv-go" disabled>Paketi üret</button>
      <span class="tk-msg" id="fv-msg">dosya bekleniyor</span></div>
  </div>
</div>
<div class="tk-panel">
  <p class="tk-h">Paket</p>
  <div id="fv-out"><p class="tk-blank">16'dan 512 piksele kadar bütün boyutlar ve HTML kodu tek seferde üretilir.</p></div>
</div>
</div>
<script>//<![CDATA[
(function(){
"use strict";
var $=function(i){return document.getElementById(i)},SIZES=[16,32,48,64,96,120,152,167,180,192,512];
var drop=$("fv-drop"),inp=$("fv-file"),go=$("fv-go"),msg=$("fv-msg"),out=$("fv-out"),img=null;
drop.addEventListener("click",function(){inp.click()});
drop.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();inp.click()}});
["dragenter","dragover"].forEach(function(v){drop.addEventListener(v,function(e){e.preventDefault();drop.classList.add("hot")})});
["dragleave","drop"].forEach(function(v){drop.addEventListener(v,function(e){e.preventDefault();drop.classList.remove("hot")})});
drop.addEventListener("drop",function(e){take(e.dataTransfer.files[0])});
inp.addEventListener("change",function(e){take(e.target.files[0])});
function take(f){
  if(!f||!/^image\//.test(f.type)){msg.textContent="g\u00f6rsel bulunamad\u0131";msg.className="tk-msg err";return}
  msg.className="tk-msg";var u=URL.createObjectURL(f),im=new Image();
  im.onload=function(){img=im;URL.revokeObjectURL(u);go.disabled=false;
    msg.textContent=im.naturalWidth+"\u00d7"+im.naturalHeight+" y\u00fcklendi";
    if(Math.min(im.naturalWidth,im.naturalHeight)<192)msg.textContent+=" \u2014 k\u00fc\u00e7\u00fck, bulan\u0131kla\u015fabilir"};
  im.src=u;
}
go.addEventListener("click",function(){
  var keep=$("fv-keep").checked,bg=$("fv-bg").value,pad=$("fv-pad").checked?0.1:0;
  var items=SIZES.map(function(s){
    var c=document.createElement("canvas");c.width=c.height=s;
    var x=c.getContext("2d");x.imageSmoothingQuality="high";
    if(!keep){x.fillStyle=bg;x.fillRect(0,0,s,s)}
    var m=Math.round(s*pad),box=s-2*m;
    var r=Math.min(box/img.naturalWidth,box/img.naturalHeight);
    var w=img.naturalWidth*r,h=img.naturalHeight*r;
    x.drawImage(img,(s-w)/2,(s-h)/2,w,h);
    return {s:s,url:c.toDataURL("image/png")};
  });
  var html='&lt;link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png"&gt;\n'
    +'&lt;link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png"&gt;\n'
    +'&lt;link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png"&gt;\n'
    +'&lt;link rel="manifest" href="/site.webmanifest"&gt;';
  out.innerHTML='<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:18px">'
    +items.map(function(o){
      return '<div style="text-align:center"><img src="'+o.url+'" width="'+Math.min(o.s,64)
        +'" height="'+Math.min(o.s,64)+'" style="image-rendering:auto;border:1px solid #e3e1dc;border-radius:4px">'
        +'<div style="font:11px var(--mono);color:var(--ink-3);margin-top:5px">'
        +'<a class="tk-dl" href="'+o.url+'" download="favicon-'+o.s+'.png">'+o.s+'px</a></div></div>';
    }).join("")+'</div>'
    +'<p class="tk-h2">Sayfan\u0131z\u0131n &lt;head&gt; b\u00f6l\u00fcm\u00fcne</p><div class="tk-out">'+html+'</div>'
    +'<p class="tk-note">Boyutlara t\u0131klayarak tek tek indirin. Sunucu k\u00f6k\u00fcnde '
    +'<code>favicon.ico</code> isteyen eski taray\u0131c\u0131lar i\u00e7in 32px s\u00fcr\u00fcm\u00fcn\u00fc '
    +'<code>favicon.ico</code> ad\u0131yla da kaydedebilirsiniz.</p>';
  msg.textContent=items.length+" boyut \u00fcretildi";
});
})();
//]]></script>

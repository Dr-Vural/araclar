<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<div class="tk-cols">
<div>
  <div class="tk-drop" id="ps-drop" tabindex="0" role="button">
    <svg viewBox="0 0 24 24"><path d="M14 2H6v20h12V8z M14 2v6h4"/><path d="M4 12h16" stroke-dasharray="3 3"/></svg>
    <strong>PDF bırakın</strong><span>Tek dosya</span>
  </div>
  <input type="file" id="ps-file" class="tk-hidden" accept="application/pdf,.pdf">
  <div class="tk-panel">
    <p class="tk-h">İşlem</p>
    <div class="tk-field"><label for="ps-mode">Yöntem</label>
      <select id="ps-mode" class="tk-sel">
        <option value="range">Belirli sayfaları çıkar</option>
        <option value="every">Her N sayfada bir böl</option>
        <option value="single">Her sayfayı ayrı dosya yap</option>
      </select></div>
    <div class="tk-field" id="ps-rw"><label for="ps-range">Sayfalar</label>
      <input type="text" id="ps-range" class="tk-in" placeholder="1-3, 7, 10-son">
      <span class="tk-msg">Örnek: <code>1-3, 7, 12-son</code> · tersten: <code>son-1</code></span></div>
    <div class="tk-field" id="ps-nw" style="display:none"><label for="ps-n">Kaç sayfada bir</label>
      <input type="number" id="ps-n" class="tk-in" value="10" min="1"></div>
    <div class="tk-acts">
      <button class="tk-btn" id="ps-go" disabled>Ayır</button>
      <span class="tk-msg" id="ps-msg">dosya bekleniyor</span>
    </div>
  </div>
</div>
<div class="tk-panel">
  <p class="tk-h">Çıktı</p>
  <div id="ps-out"><p class="tk-blank">PDF bırakın, sayfa aralığını yazın.</p></div>
</div>
</div>
<script>//<![CDATA[
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var drop=$("ps-drop"),inp=$("ps-file"),msg=$("ps-msg"),go=$("ps-go"),out=$("ps-out");
var buf=null,name="belge",total=0;
function kb(n){return n<1048576?(n/1024).toFixed(1)+" KB":(n/1048576).toFixed(2)+" MB"}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
drop.addEventListener("click",function(){inp.click()});
drop.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();inp.click()}});
["dragenter","dragover"].forEach(function(v){drop.addEventListener(v,function(e){e.preventDefault();drop.classList.add("hot")})});
["dragleave","drop"].forEach(function(v){drop.addEventListener(v,function(e){e.preventDefault();drop.classList.remove("hot")})});
drop.addEventListener("drop",function(e){take(e.dataTransfer.files[0])});
inp.addEventListener("change",function(e){take(e.target.files[0])});
$("ps-mode").addEventListener("change",function(){
  $("ps-rw").style.display=this.value==="range"?"":"none";
  $("ps-nw").style.display=this.value==="every"?"":"none";
});
function take(f){
  if(!f){return}
  name=f.name.replace(/\.pdf$/i,"");
  f.arrayBuffer().then(function(b){
    buf=b;
    return PDFLib.PDFDocument.load(b,{ignoreEncryption:true});
  }).then(function(d){
    total=d.getPageCount();go.disabled=false;
    msg.className="tk-msg";msg.textContent=total+" sayfa \u00b7 "+kb(f.size);
    $("ps-range").placeholder="1-"+Math.min(3,total)+", "+total;
  }).catch(function(e){
    msg.className="tk-msg err";
    msg.textContent=/encrypt|password/i.test(e.message)?"parola korumal\u0131 dosya":"okunamad\u0131";
  });
}
function parseRange(s,n){
  var idx=[];
  s.split(",").forEach(function(part){
    part=part.trim().toLocaleLowerCase("tr").replace(/son/g,String(n));
    if(!part)return;
    var m=part.match(/^(\d+)\s*-\s*(\d+)$/);
    if(m){
      var a=+m[1],b=+m[2],st=a<=b?1:-1;
      for(var i=a;st>0?i<=b:i>=b;i+=st)if(i>=1&&i<=n)idx.push(i-1);
    }else{
      var v=parseInt(part,10);
      if(v>=1&&v<=n)idx.push(v-1);
    }
  });
  return idx;
}
function makeDoc(src,idx){
  return PDFLib.PDFDocument.create().then(function(d){
    return d.copyPages(src,idx).then(function(ps){
      ps.forEach(function(p){d.addPage(p)});
      return d.save();
    });
  });
}
go.addEventListener("click",function(){
  if(!buf)return;
  msg.className="tk-msg";msg.textContent="ayr\u0131l\u0131yor\u2026";go.disabled=true;
  var mode=$("ps-mode").value;
  PDFLib.PDFDocument.load(buf,{ignoreEncryption:true}).then(function(src){
    var n=src.getPageCount(),jobs=[];
    if(mode==="range"){
      var idx=parseRange($("ps-range").value,n);
      if(!idx.length)throw new Error("ge\u00e7erli sayfa aral\u0131\u011f\u0131 girin");
      jobs.push({idx:idx,nm:name+"-secim.pdf"});
    }else if(mode==="every"){
      var step=parseInt($("ps-n").value,10)||10;
      for(var i=0;i<n;i+=step){
        var a=[];for(var j=i;j<Math.min(i+step,n);j++)a.push(j);
        jobs.push({idx:a,nm:name+"-"+(i+1)+"-"+Math.min(i+step,n)+".pdf"});
      }
    }else{
      for(var k=0;k<n;k++)jobs.push({idx:[k],nm:name+"-sayfa-"+(k+1)+".pdf"});
    }
    if(jobs.length>60)throw new Error("60'tan fazla par\u00e7a olu\u015fur \u2014 aral\u0131k daralt\u0131n");
    return Promise.all(jobs.map(function(j){
      return makeDoc(src,j.idx).then(function(b){
        return {nm:j.nm,blob:new Blob([b],{type:"application/pdf"}),n:j.idx.length};
      });
    }));
  }).then(function(rs){
    out.innerHTML='<ul class="tk-list">'+rs.map(function(r){
      return '<li><span class="nm"><a class="tk-dl" href="'+URL.createObjectURL(r.blob)
        +'" download="'+esc(r.nm)+'">'+esc(r.nm)+'</a></span>'
        +'<span class="sz">'+r.n+' sf</span><span class="sz">'+kb(r.blob.size)+'</span></li>';
    }).join("")+'</ul><p class="tk-note">Adlara t\u0131klayarak indirin.</p>';
    msg.textContent=rs.length+" dosya olu\u015ftu";go.disabled=false;
  }).catch(function(e){
    msg.className="tk-msg err";msg.textContent=e.message;go.disabled=false;
  });
});
})();
//]]></script>

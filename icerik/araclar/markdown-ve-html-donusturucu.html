<div class="tk-cols rev">
<div class="tk-panel">
  <p class="tk-h">Kaynak</p>
  <div class="tk-field"><label for="mh-in">Girdi</label>
    <textarea id="mh-in" class="tk-area" style="min-height:220px" spellcheck="false" placeholder="# Başlık&#10;&#10;Bir **kalın** ve bir *eğik* sözcük.&#10;&#10;- Madde bir&#10;- Madde iki"></textarea></div>
  <div class="tk-field"><label for="mh-out">Çıktı</label>
    <textarea id="mh-out" class="tk-area" style="min-height:180px" readonly spellcheck="false"></textarea></div>
  <div class="tk-acts">
    <button class="tk-btn ghost" id="mh-copy">Kopyala</button>
    <span class="tk-msg" id="mh-msg"></span>
  </div>
</div>
<div>
<div class="tk-panel">
  <p class="tk-h">Yön</p>
  <div class="tk-field"><label for="mh-dir">Dönüşüm</label>
    <select id="mh-dir" class="tk-sel">
      <option value="m2h">Markdown → HTML</option>
      <option value="h2t">HTML → düz metin</option>
      <option value="h2m">HTML → Markdown</option>
    </select></div>
  <div class="tk-checks">
    <label><input type="checkbox" id="mh-live" checked><span>Anında dönüştür</span></label>
  </div>
</div>
<div class="tk-panel">
  <p class="tk-h">Önizleme</p>
  <div class="body" id="mh-prev" style="max-height:240px;overflow:auto;font-size:14.5px"><span class="tk-blank">HTML çıktısı burada görünür.</span></div>
  <p class="tk-note">Markdown ayrıştırıcısı başlık, kalın, eğik, bağlantı,
     görsel, liste, alıntı, kod, yatay çizgi ve tabloyu destekler. Karmaşık
     ya da gömülü HTML içeren belgelerde tam bir kütüphane (marked, pandoc)
     gerekebilir; bu araç gündelik metin içindir.</p>
</div>
</div>
</div>
<script>//<![CDATA[
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inline(s){
  return s
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1">')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*]+)\*/g,"$1<em>$2</em>")
    .replace(/`([^`]+)`/g,"<code>$1</code>");
}
function md2html(md){
  var lines=md.replace(/\r/g,"").split("\n"),out=[],i=0;
  function flushList(tag){}
  while(i<lines.length){
    var l=lines[i];
    if(/^#{1,6}\s/.test(l)){var n=l.match(/^#+/)[0].length;
      out.push("<h"+n+">"+inline(esc(l.replace(/^#+\s/,"")))+"</h"+n+">");i++;continue}
    if(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)){out.push("<hr>");i++;continue}
    if(/^\s*>/.test(l)){var q=[];
      while(i<lines.length&&/^\s*>/.test(lines[i])){q.push(esc(lines[i].replace(/^\s*>\s?/,"")));i++}
      out.push("<blockquote>"+inline(q.join(" "))+"</blockquote>");continue}
    if(/^```/.test(l)){var c=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i])){c.push(esc(lines[i]));i++}
      i++;out.push("<pre><code>"+c.join("\n")+"</code></pre>");continue}
    if(/^\s*[-*+]\s/.test(l)){var items=[];
      while(i<lines.length&&/^\s*[-*+]\s/.test(lines[i])){
        items.push("<li>"+inline(esc(lines[i].replace(/^\s*[-*+]\s/,"")))+"</li>");i++}
      out.push("<ul>"+items.join("")+"</ul>");continue}
    if(/^\s*\d+\.\s/.test(l)){var oi=[];
      while(i<lines.length&&/^\s*\d+\.\s/.test(lines[i])){
        oi.push("<li>"+inline(esc(lines[i].replace(/^\s*\d+\.\s/,"")))+"</li>");i++}
      out.push("<ol>"+oi.join("")+"</ol>");continue}
    if(/^\s*\|.*\|/.test(l)&&i+1<lines.length&&/^\s*\|?[\s:\-|]+\|?\s*$/.test(lines[i+1])){
      var head=l.replace(/^\||\|$/g,"").split("|").map(function(c){return c.trim()});
      i+=2;var body=[];
      while(i<lines.length&&/^\s*\|.*\|/.test(lines[i])){
        body.push(lines[i].replace(/^\||\|$/g,"").split("|").map(function(c){return c.trim()}));i++}
      var h="<table><thead><tr>"+head.map(function(c){return "<th>"+inline(esc(c))+"</th>"}).join("")+"</tr></thead>";
      h+="<tbody>"+body.map(function(r){return "<tr>"+r.map(function(c){return "<td>"+inline(esc(c))+"</td>"}).join("")+"</tr>"}).join("")+"</tbody></table>";
      out.push(h);continue}
    if(l.trim()===""){i++;continue}
    var para=[];
    while(i<lines.length&&lines[i].trim()!==""&&!/^(#{1,6}\s|\s*[-*+]\s|\s*\d+\.\s|\s*>|```|\s*\|)/.test(lines[i])){
      para.push(esc(lines[i]));i++}
    out.push("<p>"+inline(para.join(" "))+"</p>");
  }
  return out.join("\n");
}
function html2text(h){
  return h.replace(/<style[\s\S]*?<\/style>/gi,"").replace(/<script[\s\S]*?<\/script>/gi,"")
    .replace(/<\/(p|div|h[1-6]|li|tr|br)>/gi,"\n").replace(/<br\s*\/?>/gi,"\n")
    .replace(/<li[^>]*>/gi,"\u2022 ").replace(/<[^>]+>/g,"")
    .replace(/&nbsp;/g," ").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/\n{3,}/g,"\n\n").replace(/[ \t]{2,}/g," ").trim();
}
function html2md(h){
  h=h.replace(/<style[\s\S]*?<\/style>/gi,"").replace(/<script[\s\S]*?<\/script>/gi,"");
  for(var n=1;n<=6;n++)h=h.replace(new RegExp("<h"+n+"[^>]*>([\\s\\S]*?)</h"+n+">","gi"),
    "\n"+"#".repeat(n)+" $1\n");
  h=h.replace(/<strong[^>]*>([\s\S]*?)<\/strong>/gi,"**$1**").replace(/<b>([\s\S]*?)<\/b>/gi,"**$1**")
    .replace(/<em[^>]*>([\s\S]*?)<\/em>/gi,"*$1*").replace(/<i>([\s\S]*?)<\/i>/gi,"*$1*")
    .replace(/<code[^>]*>([\s\S]*?)<\/code>/gi,"`$1`")
    .replace(/<a[^>]*href="([^"]*)"[^>]*>([\s\S]*?)<\/a>/gi,"[$2]($1)")
    .replace(/<img[^>]*alt="([^"]*)"[^>]*src="([^"]*)"[^>]*>/gi,"![$1]($2)")
    .replace(/<img[^>]*src="([^"]*)"[^>]*>/gi,"![]($1)")
    .replace(/<li[^>]*>([\s\S]*?)<\/li>/gi,"- $1\n")
    .replace(/<blockquote[^>]*>([\s\S]*?)<\/blockquote>/gi,"> $1\n")
    .replace(/<hr\s*\/?>/gi,"\n---\n").replace(/<\/p>/gi,"\n\n").replace(/<br\s*\/?>/gi,"\n")
    .replace(/<[^>]+>/g,"").replace(/&amp;/g,"&").replace(/&lt;/g,"<").replace(/&gt;/g,">")
    .replace(/\n{3,}/g,"\n\n").trim();
  return h;
}
function run(){
  var dir=$("mh-dir").value,t=$("mh-in").value,out;
  if(dir==="m2h"){out=md2html(t);$("mh-prev").innerHTML=out||'<span class="tk-blank">\u2014</span>'}
  else if(dir==="h2t"){out=html2text(t);$("mh-prev").textContent=out}
  else{out=html2md(t);$("mh-prev").textContent=out}
  $("mh-out").value=out;
  $("mh-msg").textContent=out.length+" karakter";
}
$("mh-dir").addEventListener("change",run);
$("mh-in").addEventListener("input",function(){if($("mh-live").checked)run()});
$("mh-copy").addEventListener("click",function(){
  navigator.clipboard.writeText($("mh-out").value).then(function(){$("mh-msg").textContent="kopyaland\u0131"})});
})();
//]]></script>

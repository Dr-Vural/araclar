  <div class="tk-stats">
    <div class="tk-stat"><b id="mj-p">—</b><span>geçiş</span></div>
    <div class="tk-stat ok"><b id="mj-f">—</b><span>onarılan</span></div>

  <p class="tk-note">UTF-8 kodlanmış metin, Windows-1254 veya Latin-1 sanılarak
     okunduğunda her Türkçe harf iki karaktere dağılır: <code>ç</code> →

<script>//<![CDATA[
(function(){
"use strict";
var $=function(i){return document.getElementById(i)};
var CP={0x20AC:0x80,0x201A:0x82,0x0192:0x83,0x201E:0x84,0x2026:0x85,0x2020:0x86,
0x2021:0x87,0x02C6:0x88,0x2030:0x89,0x0160:0x8A,0x2039:0x8B,0x0152:0x8C,0x017D:0x8E,
0x2018:0x91,0x2019:0x92,0x201C:0x93,0x201D:0x94,0x2022:0x95,0x2013:0x96,0x2014:0x97,
0x02DC:0x98,0x2122:0x99,0x0161:0x9A,0x203A:0x9B,0x0153:0x9C,0x017E:0x9E,0x0178:0x9F};
var inp=$("mj-in"),out=$("mj-out"),diag=$("mj-diag"),msg=$("mj-msg");
function bytes(s){
  var b=new Uint8Array(s.length);
  for(var i=0;i<s.length;i++){
    var c=s.charCodeAt(i);
    if(c<0x100)b[i]=c;
    else if(CP[c]!==undefined)b[i]=CP[c];
    else return null;
  }
  return b;
}
function pass(s){
  var b=bytes(s); if(!b)return null;
  try{return new TextDecoder("utf-8",{fatal:true}).decode(b)}catch(e){return null}
}
function run(){
  var s=inp.value,n=0,cur=s;
  for(var i=0;i<4;i++){
    var r=pass(cur);
    if(r===null||r===cur)break;
    cur=r;n++;
  }
  out.value=cur;
  $("mj-p").textContent=n;
  var fixed=0;
  for(var j=0;j<Math.min(s.length,cur.length);j++){}
  fixed=s.length-cur.length;
  $("mj-f").textContent=n?Math.max(fixed,0):0;
  if(!s.trim()){diag.innerHTML='<span class="tk-blank">Metin yap\u0131\u015ft\u0131r\u0131n.</span>';msg.textContent="";return}
  if(!n){diag.innerHTML='<span class="tk-good">Bozulma bulunamad\u0131.</span> '
    +'Metin zaten do\u011fru kodlanm\u0131\u015f g\u00f6r\u00fcn\u00fcyor.';msg.textContent="temiz"}
  else{
    var ex=[],seen={};
    var m=s.match(/[\u00c3\u00c4\u00c5][\u0080-\u00ff\u2018-\u201e\u0160-\u017e]/g)||[];
    m.forEach(function(p){if(!seen[p]){seen[p]=1;ex.push(p)}});
    diag.innerHTML=n+" ge\u00e7i\u015fte onar\u0131ld\u0131.\n"
      +(ex.length?"Bulunan bozuk ikililer: "+ex.slice(0,14).join("  "):"");
    msg.textContent="onar\u0131ld\u0131";
  }
}
inp.addEventListener("input",run);
$("mj-demo").addEventListener("click",function(){
  inp.value="\u00c3\u2013\u00c4\u0178renci de\u00c4\u0178i\u00c5\u0178im program\u00c4\u00b1 i\u00c3\u00a7in ba\u00c5\u0178vurular 15 Eyl\u00c3\u00bcl'de sona eriyor. "
    +"Ayr\u00c4\u00b1nt\u00c4\u00b1l\u00c4\u00b1 bilgi i\u00c3\u00a7in \u00c3\u00b6\u00c4\u0178renci i\u00c5\u0178leri birimine ba\u00c5\u0178vurunuz.";run()});
$("mj-copy").addEventListener("click",function(){
  navigator.clipboard.writeText(out.value).then(function(){msg.textContent="kopyaland\u0131"})});
})();
//]]></script>
